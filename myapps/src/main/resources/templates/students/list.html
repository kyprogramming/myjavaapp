<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Students | My App</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .table-container {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #ecf0f1;
        }

        th {
            background: #f8f9fa;
            font-weight: 600;
            color: #34495e;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
        }

        tr:hover {
            background: #f8f9fa;
        }

        .badge-id {
            background: #3498db;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .actions a {
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
            margin-right: 6px;
            font-weight: 600;
        }

        .edit-btn {
            background: #f39c12;
            color: white;
        }

        .delete-btn {
            background: #e74c3c;
            color: white;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .empty {
            text-align: center;
            padding: 60px 20px;
            color: #95a5a6;
        }

        .empty .icon {
            font-size: 60px;
            margin-bottom: 16px;
        }
    </style>
</head>

<body>

    <div th:replace="~{fragments/header :: navbar('students')}"></div>

    <div class="container" style="padding-top: 40px;">

        <div class="header-row">
            <div>
                <h1 style="margin-bottom: 4px;">Students</h1>
                <p style="color: #7f8c8d;">
                    Total: <strong th:text="${total}">0</strong> students
                </p>
            </div>
            <a href="/students/new" class="btn btn-primary">+ Add Student</a>
        </div>

        <div class="table-container">

            <!-- Empty state -->
            <div class="empty" th:if="${students.isEmpty()}">
                <div class="icon">📭</div>
                <h3>No students yet</h3>
                <p>Click "Add Student" to add your first student</p>
            </div>

            <!-- Table -->
            <table th:unless="${students.isEmpty()}">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Age</th>
                        <th>Course</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="student : ${students}">
                        <td><span class="badge-id" th:text="'#' + ${student.id}">#1</span></td>
                        <td th:text="${student.name}">Kaushal</td>
                        <td th:text="${student.email}">rahul@example.com</td>
                        <td th:text="${student.age}">20</td>
                        <td th:text="${student.course}">Java</td>
                        <td class="actions">
                            <a th:href="@{/students/edit/{id}(id=${student.id})}" class="edit-btn">Edit</a>
                            <a th:href="@{/students/delete/{id}(id=${student.id})}" class="delete-btn"
                                onclick="return confirm('Delete this student?')">Delete</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>

    <div th:replace="~{fragments/header :: footer}"></div>

</body>

</html>
