<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Student Form | My App</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .form-wrapper {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .form-container {
            background: white;
            border-radius: 20px;
            padding: 50px 60px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            border-top: 6px solid #3498db;
        }

        .form-header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 2px solid #ecf0f1;
        }

        .form-header h2 {
            font-size: 28px;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        .form-header .subtitle {
            color: #7f8c8d;
            font-size: 16px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 28px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-weight: 600;
            font-size: 15px;
            color: #34495e;
        }

        .form-group label .required {
            color: #e74c3c;
            margin-left: 3px;
        }

        .form-group input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid #e1e8ed;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            transition: all 0.2s;
            background: #fafbfc;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #3498db;
            background: white;
            box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.1);
        }

        .form-group.has-error label {
            color: #e74c3c;
        }

        .form-group.has-error input {
            border-color: #e74c3c;
            background: #fef5f5;
        }

        .error-message {
            display: block;
            color: #e74c3c;
            font-size: 13px;
            margin-top: 8px;
            font-weight: 500;
            padding-left: 4px;
        }

        .error-message::before {
            content: "⚠ ";
            margin-right: 4px;
        }

        .form-actions {
            display: flex;
            gap: 16px;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #ecf0f1;
        }

        .form-actions .btn {
            flex: 1;
            padding: 16px 28px;
            font-size: 16px;
            text-align: center;
        }

        .alert-error {
            background: #fdecea;
            color: #b71c1c;
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            border-left: 4px solid #e74c3c;
        }

        @media (max-width: 768px) {
            .form-container {
                padding: 30px 24px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .form-actions {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div th:replace="~{fragments/header :: navbar('students')}"></div>

    <div class="form-wrapper">
        <div class="form-container">

            <div class="form-header">
                <h2 th:if="${!isEdit}">Add New Student</h2>
                <h2 th:if="${isEdit}">Edit Student</h2>
                <p class="subtitle" th:if="${!isEdit}">Fill in all the details below</p>
                <p class="subtitle" th:if="${isEdit}">Update the student information</p>
            </div>

            <div class="alert-error" th:if="${errorMessage}">
                <strong>⚠ Error:</strong>
                <span th:text="${errorMessage}"></span>
            </div>

            <form th:action="@{/students/save}" th:object="${student}" method="post">

                <input type="hidden" th:field="*{id}">

                <div class="form-row">
                    <div class="form-group" th:classappend="${#fields.hasErrors('name')} ? 'has-error'">
                        <label for="name">Name <span class="required">*</span></label>
                        <input type="text" id="name" th:field="*{name}" placeholder="Enter full name">
                        <span class="error-message" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
                    </div>

                    <div class="form-group" th:classappend="${#fields.hasErrors('email')} ? 'has-error'">
                        <label for="email">Email <span class="required">*</span></label>
                        <input type="email" id="email" th:field="*{email}" placeholder="student@example.com">
                        <span class="error-message" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group" th:classappend="${#fields.hasErrors('age')} ? 'has-error'">
                        <label for="age">Age <span class="required">*</span></label>
                        <input type="number" id="age" th:field="*{age}" placeholder="Enter age" min="1" max="120">
                        <span class="error-message" th:if="${#fields.hasErrors('age')}" th:errors="*{age}"></span>
                    </div>

                    <div class="form-group" th:classappend="${#fields.hasErrors('course')} ? 'has-error'">
                        <label for="course">Course <span class="required">*</span></label>
                        <input type="text" id="course" th:field="*{course}" placeholder="e.g. Java Programming">
                        <span class="error-message" th:if="${#fields.hasErrors('course')}" th:errors="*{course}"></span>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        <span th:if="${!isEdit}">💾 Save Student</span>
                        <span th:if="${isEdit}">✅ Update Student</span>
                    </button>
                    <a href="/students" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </div>

    <div th:replace="~{fragments/header :: footer}"></div>

</body>

</html>
