<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | My Java App</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <!-- Navbar -->
    <div th:replace="~{fragments/header :: navbar('contact')}"></div>

    <!-- Hero -->
    <section class="hero" style="padding: 50px 20px;">
        <h1>Get in Touch</h1>
        <p>Have a question? Send me a message</p>
    </section>

    <!-- Form -->
    <div class="container">
        <div class="form-container">

            <!-- Success message -->
            <div class="alert alert-success" th:if="${success}">
                ✅ <strong>Thank you!</strong> Your message has been sent successfully.
            </div>

            <h2>Contact Form</h2>
            <p class="subtitle">Fill in your details below</p>

            <form method="post" action="/contact">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" placeholder="Kaushal Sharma" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="rahul@example.com" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" placeholder="Write your message here..." required></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Send Message ✉</button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <div th:replace="~{fragments/header :: footer}"></div>

</body>

</html>
