# ═══════════════════════════════════════
# APP
# ═══════════════════════════════════════
spring.application.name=myapps
server.port=${PORT:8080}

# ═══════════════════════════════════════
# THYMELEAF
# ═══════════════════════════════════════
spring.thymeleaf.cache=true

# ═══════════════════════════════════════
# POSTGRESQL
# ═══════════════════════════════════════
spring.datasource.url=jdbc:postgresql://localhost:5432/myappdb
spring.datasource.username=myappuser
spring.datasource.password=myapppassword
spring.datasource.driver-class-name=org.postgresql.Driver

# ═══════════════════════════════════════
# H2 CONSOLE (browser access for local testing)
# ═══════════════════════════════════════
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ═══════════════════════════════════════
# HIKARI — retry and timeout settings
# ═══════════════════════════════════════
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.initialization-fail-timeout=120000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# ═══════════════════════════════════════
# JPA / HIBERNATE
# ═══════════════════════════════════════
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ═══════════════════════════════════════
# LOGGING
# ═══════════════════════════════════════
logging.level.root=INFO
logging.level.com.example.myapps=INFO

# Remote connection 
spring.h2.console.settings.web-allow-others=true

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=60000